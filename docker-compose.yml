version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: knowledge-assistant-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - registry-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: knowledge-assistant-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  registry-data:
